server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Real client IP when running behind the reverse proxy on the Pi
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    # Hashed bundles (outputHashing: all) never change, so cache them forever
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|pdf)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Angular router: real file -> prerendered route -> SPA shell
    location / {
        try_files $uri $uri/index.html /index.csr.html /index.html;
        add_header Cache-Control "no-cache";
    }
}
